.tile.covered { cursor: default; }
.tile.covered .mask { opacity: .65; }
.tile.gone { transform: scale(0); opacity: 0; pointer-events: none; }
.tile.shake { animation: shake .35s; }
@keyframes shake {
  25% { transform: rotate(-8deg); }
  75% { transform: rotate(8deg); }
}

.out-area {
  position: absolute;
  border-radius: 10px;
  background: rgba(255, 255, 255, .18);
}

.slot-bar {
  position: absolute;
  border-radius: 12px;
  background: linear-gradient(#c58a4a, #9c6430);
  border: 3px solid #6e4219;
  box-shadow: inset 0 3px 0 rgba(255, 255, 255, .25), 0 3px 0 rgba(0, 0, 0, .2);
}

.props {
  display: flex;
  justify-content: center;
  gap: 12px;
  margin: 12px 0 6px;
}

button {
  font: inherit;
  font-size: 14px;
  padding: 6px 14px;
  border: none;
  border-radius: 999px;
  background: #fff;
  color: #3d5a1e;
  box-shadow: 0 3px 0 #6c9a3c;
  cursor: pointer;
}
button:active { transform: translateY(2px); box-shadow: 0 1px 0 #6c9a3c; }
button:disabled { opacity: .45; cursor: not-allowed; }
.level-btn.active { background: #4f8a1f; color: #fff; }

.props button {
  position: relative;
  padding: 10px 22px;
  font-size: 16px;
  font-weight: bold;
  background: #2f8de4;
  color: #fff;
  box-shadow: 0 4px 0 #1b5f9e;
}
.props button i {
  position: absolute;
  top: -6px;
  right: -6px;
  min-width: 20px;
  height: 20px;
  line-height: 20px;
  border-radius: 10px;
  background: #ff5a3c;
  font-style: normal;
  font-size: 12px;
}

footer { font-size: 12px; text-align: center; }
footer .row { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin-top: 6px; }
footer input {
  font: inherit;
  width: 260px;
  padding: 5px 10px;
  border-radius: 999px;
  border: 2px solid #6c9a3c;
}
footer button { font-size: 12px; padding: 4px 10px; }

#dialog {
  position: fixed;
  inset: 0;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(0, 0, 0, .45);
  z-index: 99999;
}
#dialog.show { display: flex; }
#dialog .box {
  width: 300px;
  padding: 20px;
  border-radius: 16px;
  background: #fffbe8;
  text-align: center;
}
#dialog h2 { margin: 0 0 8px; }
#dialog p { margin: 0 0 16px; font-size: 14px; }
#dlgButtons { display: flex; flex-direction: column; gap: 8px; }

    const tiles = [];
    for (const layerKey of Object.keys(map.levelData)) {
      for (const n of map.levelData[layerKey]) {
        let type = n.type | 0;
        if (type === 0) type = pool.pop();
        const cfg = map.blockTypeCfg && map.blockTypeCfg[type];
        tiles.push({
          index: tiles.length, id: n.id,
          layer: n.layerNum | 0, col: n.rolNum | 0, row: n.rowNum | 0,
          mold: n.moldType | 0, type: cfg !== undefined ? cfg : type,
          blockers: [], covers: [],
        });
      }
    }
    // checkIsShow：更高层、两轴距离都 < minBlockNum 即被压住
    for (const a of tiles) for (const b of tiles) {
      if (b.layer > a.layer && Math.abs(b.col - a.col) < BLOCK && Math.abs(b.row - a.row) < BLOCK) {
        a.blockers.push(b.index); b.covers.push(a.index);
      }
    }
    return tiles;
  }

  // crushArea.getNewPosit
  function slotInsertPos(slotTypes, type) {
    for (let n = slotTypes.length - 1; n >= 0; n--) {
      if (slotTypes[n] !== type) continue;
      let cnt = 1;
      for (let i = n - 1; i >= 0; i--) if (slotTypes[i] === type) cnt++;
      if (cnt % 3 === 0) break;
      return n + 1;
    }
    return slotTypes.length;
  }

  // crushArea.isCrushBlock：返回第一组相邻三张同类的起点，没有则 -1
  function findTriple(slotTypes) {
    for (let i = 0; i + 2 < slotTypes.length; i++) {
      if (slotTypes[i] === slotTypes[i + 1] && slotTypes[i] === slotTypes[i + 2]) return i;
    }
    return -1;
  }

  global.SheepCore = { BLOCK, SLOT_CAP, XorShift, shuffle, randomSeed, buildTiles, slotInsertPos, findTriple };
})(window);

</script>
  <script>
(function () {
  "use strict";
  const { BLOCK, SLOT_CAP, randomSeed, buildTiles, slotInsertPos, findTriple } = window.SheepCore;
  const LEVELS = window.SHEEP_LEVELS;
  const LEVEL_KEYS = ["level1", "level2"];
  const TILE_W = 120, TILE_H = 135;     // 原始贴图尺寸（blockMaxWidth / blockMaxHeight）
  const OUT_SCALE = 0.8;                 // moveOutArea.newScale
  const OUT_ADD_Y = 8;                   // moveOutArea.newAddY（原始像素）
  const ELIMINATE_DELAY = 220;
  const PROP_LIMIT = 1;                  // GAME_PROP_USE_LIMITS

  const $ = (s) => document.querySelector(s);
  // 单文件打包时资源以 data URI 注入到 window.SHEEP_ASSETS
  const asset = (p) => (window.SHEEP_ASSETS && window.SHEEP_ASSETS[p]) || p;
  const stage = $("#stage");
  const sounds = {};
  let soundOn = true;
  for (const name of ["clickBlock", "crush", "levelInit", "moveOut", "blockRandom", "almost_fail", "combo"]) {
    sounds[name] = new Audio(asset(`assets/sound/${name}.mp3`));
  }
  function play(name) {
    if (!soundOn || !sounds[name]) return;
    const a = sounds[name].cloneNode();
    a.volume = 0.6;
    a.play().catch(() => {});
  }

  let game = null;
  let geo = null;

  // ---------------- 布局 ----------------
  function computeGeometry(map) {
    const W = Math.min(stage.parentElement.clientWidth - 16, 480);
    const tw = W / map.widthNum;
    const th = tw * TILE_H / TILE_W;
    const unit = tw / BLOCK;
    const boardH = map.heightNum * BLOCK * unit + (th - tw);
    const outTw = tw * OUT_SCALE, outTh = th * OUT_SCALE;
    const outTop = boardH + 14;
    const outH = outTh + 6 * OUT_ADD_Y * (tw / TILE_W);
    const slotTop = outTop + outH + 10;
    const slotTw = Math.min(tw, (W - 24) / SLOT_CAP);
    const slotTh = slotTw * TILE_H / TILE_W;
    const slotH = slotTh + 20;
    return { W, tw, th, unit, boardH, outTw, outTh, outTop, slotTop, slotTw, slotTh, slotH, H: slotTop + slotH + 6 };
  }

  function boardPos(t) { return { x: t.col * geo.unit, y: t.row * geo.unit, w: geo.tw, h: geo.th }; }

  function slotPos(i) {
    const left = (geo.W - SLOT_CAP * geo.slotTw) / 2;
    return { x: left + i * geo.slotTw, y: geo.slotTop + 10, w: geo.slotTw, h: geo.slotTh };
  }

  function outPos(col, n) {
    const total = 3 * geo.outTw + 2 * 10;
    const left = (geo.W - total) / 2 + col * (geo.outTw + 10);
    const lift = n * OUT_ADD_Y * (geo.tw / TILE_W);
    return { x: left, y: geo.outTop + 6 * OUT_ADD_Y * (geo.tw / TILE_W) - lift, w: geo.outTw, h: geo.outTh };
  }

  function place(el, p, z) {
    el.style.left = p.x + "px";
    el.style.top = p.y + "px";
    el.style.width = p.w + "px";
    el.style.height = p.h + "px";
    if (z !== undefined) el.style.zIndex = z;
  }

  // ---------------- 状态 ----------------
  function newGame(levelKey, seed) {
    const map = LEVELS[levelKey];
    stage.innerHTML = "";
    const outBg = document.createElement("div");
    outBg.className = "out-area";
    stage.appendChild(outBg);
    const slotBg = document.createElement("div");
    slotBg.className = "slot-bar";
    stage.appendChild(slotBg);

    const tiles = buildTiles(map, seed);
    for (const t of tiles) {
      t.blockLeft = t.blockers.length;
      t.where = "board";
      const el = document.createElement("div");
      el.className = "tile";
      el.innerHTML = `<div class="icon"></div><div class="mask"></div>`;
      el.addEventListener("click", () => onTileClick(t.index));
      t.el = el;
      setIcon(t);
      stage.appendChild(el);
    }

    game = {
      levelKey, map, seed, tiles, outBg, slotBg,
      slot: [], out: [[], [], []], cancel: [],
      props: { moveOut: 0, undo: 0, shuffle: 0, relive: 0 },
      gold: 0, busy: false, over: false,
    };
    layoutAll();
    refreshCovered();
    updateHud();
    hideDialog();
    play("levelInit");
  }

  function setIcon(t) {
    t.el.querySelector(".icon").style.backgroundImage = `url(${asset(`assets/block/block_${t.type}.png`)})`;
    t.el.dataset.type = t.type;
  }

  function isClickable(t) {
    if (t.where === "board") return t.blockLeft === 0;
    if (t.where === "out") { const col = game.out[t.outCol]; return col[col.length - 1] === t.index; }
    return false;
  }

  function refreshCovered() {
    for (const t of game.tiles) {
      if (t.where === "board" || t.where === "out") t.el.classList.toggle("covered", !isClickable(t));
      else t.el.classList.remove("covered");
    }
  }

  function layoutSlot() {
    game.slot.forEach((idx, i) => place(game.tiles[idx].el, slotPos(i), 5000 + i));
  }

  function layoutAll() {
    geo = computeGeometry(game.map);
    stage.style.width = geo.W + "px";
    stage.style.height = geo.H + "px";
    Object.assign(game.outBg.style, { left: "0px", top: geo.outTop + "px", width: geo.W + "px", height: (geo.slotTop - geo.outTop - 10) + "px" });
    const slotW = SLOT_CAP * geo.slotTw + 16;
    Object.assign(game.slotBg.style, { left: (geo.W - slotW) / 2 + "px", top: geo.slotTop + "px", width: slotW + "px", height: geo.slotH + "px" });
    game.tiles.forEach(t => { if (t.where === "board") place(t.el, boardPos(t), 10 + t.index); });
    layoutOut();
    layoutSlot();
  }

  function layoutOut() {
    game.out.forEach((col, c) => col.forEach((idx, n) => place(game.tiles[idx].el, outPos(c, n), 4000 + c * 50 + n)));
  }

  // ---------------- 操作 ----------------
  function onTileClick(idx) {
    if (!game || game.busy || game.over) return;
    const t = game.tiles[idx];
    if (!isClickable(t) || game.slot.length >= SLOT_CAP) return;
    play("clickBlock");

    const from = t.where === "out" ? { kind: "out", col: t.outCol } : { kind: "board" };
    if (t.where === "board") {
      for (const c of t.covers) game.tiles[c].blockLeft--;
    } else {
      game.out[t.outCol].pop();
    }
    t.where = "slot";
    const types = game.slot.map(i => game.tiles[i].type);
    game.slot.splice(slotInsertPos(types, t.type), 0, idx);
    game.cancel.push({ idx, from });
    layoutSlot();
    refreshCovered();

    const k = findTriple(game.slot.map(i => game.tiles[i].type));
    if (k >= 0) {
      const removed = game.slot.splice(k, 3);
      game.cancel = [];
      game.busy = true;
      setTimeout(() => {
        removed.forEach(i => { const r = game.tiles[i]; r.where = "gone"; r.el.classList.add("gone"); });
        if (game.tiles[removed[0]].type === 17) game.gold += 3;
        play("crush");
        layoutSlot();
        game.busy = false;
        updateHud();
        checkWin();
      }, ELIMINATE_DELAY);
    } else if (game.slot.length >= SLOT_CAP) {
      game.over = true;
      setTimeout(onFail, ELIMINATE_DELAY + 100);
    } else if (game.slot.length >= SLOT_CAP - 1) {
      play("almost_fail");
    }
    updateHud();
  }

  // crushArea.moveOutBlock：卡槽前 3 张移到暂存区 3 列
  function doMoveOut() {
    const taken = game.slot.splice(0, Math.min(3, game.slot.length));
    taken.forEach((idx, c) => {
      const t = game.tiles[idx];
      t.where = "out"; t.outCol = c;
      game.out[c].push(idx);
    });
    game.cancel = [];
    play("moveOut");
    layoutOut();
    layoutSlot();
    refreshCovered();
  }

  function useMoveOut() {
    if (!game || game.busy || game.over || game.props.moveOut >= PROP_LIMIT || !game.slot.length) return;
    game.props.moveOut++;
    doMoveOut();
    updateHud();
  }

  function useUndo() {
    if (!game || game.busy || game.over || game.props.undo >= PROP_LIMIT || !game.cancel.length) return;
    const { idx, from } = game.cancel.pop();
    const t = game.tiles[idx];
    game.slot.splice(game.slot.indexOf(idx), 1);
    if (from.kind === "board") {
      t.where = "board";
      for (const c of t.covers) game.tiles[c].blockLeft++;
      place(t.el, boardPos(t), 10 + t.index);
    } else {
      t.where = "out"; t.outCol = from.col;
      game.out[from.col].push(idx);
      layoutOut();
    }
    game.props.undo++;
    layoutSlot();
    refreshCovered();
    updateHud();
  }

  // 洗牌：客户端实现未在代码中定位到，此处按"棋盘剩余牌图案重新打乱、位置不变"处理
  function useShuffle() {
    if (!game || game.busy || game.over || game.props.shuffle >= PROP_LIMIT) return;
    const rest = game.tiles.filter(t => t.where === "board");
    const types = rest.map(t => t.type);
    for (let i = types.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [types[i], types[j]] = [types[j], types[i]]; }
    rest.forEach((t, i) => { t.type = types[i]; setIcon(t); t.el.classList.remove("shake"); void t.el.offsetWidth; t.el.classList.add("shake"); });
    game.props.shuffle++;
    play("blockRandom");
    updateHud();
  }

  function onFail() {
    const canRelive = game.props.relive < PROP_LIMIT;
    showDialog("卡槽满了", canRelive ? "可以复活一次：把卡槽前 3 张移到暂存区继续。" : "道具已用完。",
      canRelive ? [["复活", relive], ["重开本局", restart], ["换个种子", newSeedGame]] : [["重开本局", restart], ["换个种子", newSeedGame]]);
  }

  // crushArea.rebornGameFunc 即调用 moveOutBlock
  function relive() {
    game.props.relive++;
    game.over = false;
    hideDialog();
    doMoveOut();
    updateHud();
  }

  function checkWin() {
    const left = game.tiles.some(t => t.where !== "gone");
    if (left) return;
    game.over = true;
    const idx = LEVEL_KEYS.indexOf(game.levelKey);
    const next = LEVEL_KEYS[idx + 1];
    const btns = next ? [["进入下一关", () => newGame(next, game.seed)], ["再玩一次", restart]] : [["再来一局", newSeedGame]];
    setTimeout(() => showDialog("通关！", `清掉了全部 ${game.tiles.length} 张牌。`, btns), 300);
  }

  function restart() { newGame(game.levelKey, game.seed); }
  function newSeedGame() { const s = randomSeed(); $("#seedInput").value = s.join(","); newGame(game ? game.levelKey : "level1", s); }

  // ---------------- HUD / 弹窗 ----------------
  function updateHud() {
    const left = game.tiles.filter(t => t.where === "board").length;
    const outCount = game.out.reduce((a, c) => a + c.length, 0);
    const lv = LEVEL_KEYS.indexOf(game.levelKey) + 1;
    let info = `第 ${lv} 关 · levelKey ${game.map.levelKey} · 棋盘剩余 ${left} 张`;
    if (outCount) info += ` · 暂存 ${outCount} 张`;
    const gd = game.map.goldBlockData;
    if (gd && gd.collectCount) info += ` · 金块(17) 已消 ${game.gold}/${gd.collectCount}`;
    $("#info").textContent = info;
    $("#seedLabel").textContent = `种子 [${game.seed.join(", ")}]`;
    const set = (id, used, enabled) => {
      const b = $(id);
      b.querySelector("i").textContent = PROP_LIMIT - used;
      b.disabled = used >= PROP_LIMIT || !enabled;
    };
    set("#btnMoveOut", game.props.moveOut, game.slot.length > 0);
    set("#btnUndo", game.props.undo, game.cancel.length > 0);
    set("#btnShuffle", game.props.shuffle, true);
    document.querySelectorAll(".level-btn").forEach(b => b.classList.toggle("active", b.dataset.level === game.levelKey));
  }

  function showDialog(title, text, buttons) {
    $("#dlgTitle").textContent = title;
    $("#dlgText").textContent = text;
    const box = $("#dlgButtons");
    box.innerHTML = "";
    for (const [label, fn] of buttons) {
      const b = document.createElement("button");
      b.textContent = label;
      b.onclick = fn;
      box.appendChild(b);
    }
    $("#dialog").classList.add("show");
  }
  function hideDialog() { $("#dialog").classList.remove("show"); }

  // ---------------- 入口 ----------------
  function parseSeed(text) {
    const nums = text.split(/[\s,，]+/).filter(Boolean).map(Number);
    return nums.length === 4 && nums.every(Number.isFinite) ? nums.map(v => v | 0) : null;
  }

  $("#btnMoveOut").onclick = useMoveOut;
  $("#btnUndo").onclick = useUndo;
  $("#btnShuffle").onclick = useShuffle;
  $("#btnRestart").onclick = restart;
  $("#btnNewSeed").onclick = newSeedGame;
  $("#btnApplySeed").onclick = () => {
    const s = parseSeed($("#seedInput").value);
    if (!s) { alert("种子格式：4 个整数，用逗号分隔"); return; }
    newGame(game.levelKey, s);
  };
  $("#btnSound").onclick = (e) => { soundOn = !soundOn; e.target.textContent = soundOn ? "音效：开" : "音效：关"; };
  document.querySelectorAll(".level-btn").forEach(b => { b.onclick = () => newGame(b.dataset.level, game.seed); });
  window.addEventListener("resize", () => { if (game) layoutAll(); });

  const DEFAULT_SEED = [-1861566937, 1699691142, -1016648759, -1852243649];
  const seed = DEFAULT_SEED.slice();
  $("#seedInput").value = seed.join(",");
  newGame("level1", seed);
})();

</script>
